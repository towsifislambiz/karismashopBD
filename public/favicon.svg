<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient: Royal Midnight Obsidian with warm gold ambient glow -->
    <radialGradient id="ksBg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#1A1E2C" />
      <stop offset="45%" stop-color="#0D0F16" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Imperial Metallic Gold Gradient (High Lustre) -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="15%" stop-color="#F5D77F" />
      <stop offset="42%" stop-color="#D4AF37" />
      <stop offset="68%" stop-color="#9E781E" />
      <stop offset="84%" stop-color="#E9CB76" />
      <stop offset="100%" stop-color="#FFF2C2" />
    </linearGradient>

    <!-- Light Gold Bevel Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F6B17" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="65%" stop-color="#FFF9DB" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Vertical Gold Gradient for K Pillar -->
    <linearGradient id="goldPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C2" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F7DE8E" />
      <stop offset="75%" stop-color="#AA8022" />
      <stop offset="100%" stop-color="#E5C367" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D4" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#735108" />
      <stop offset="75%" stop-color="#F2D379" />
      <stop offset="100%" stop-color="#A87E1F" />
    </linearGradient>

    <!-- Luxury Drop Shadow Filter -->
    <filter id="shadowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Background Canvas: Rounded Luxury Squircle -->
  <rect x="18" y="18" width="476" height="476" rx="108" ry="108" fill="url(#ksBg)" />

  <!-- 2. Concentric Regal Gold Borders -->
  <!-- Outer Primary Gold Frame -->
  <rect x="26" y="26" width="460" height="460" rx="100" ry="100" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" />
  
  <!-- Inner Fine Filigree Pinstripe -->
  <rect x="38" y="38" width="436" height="436" rx="88" ry="88" fill="none" stroke="url(#goldBevel)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="16 5" />

  <!-- 4 Regal Corner Studs -->
  <circle cx="82" cy="82" r="3.5" fill="url(#goldMetallic)" />
  <circle cx="430" cy="82" r="3.5" fill="url(#goldMetallic)" />
  <circle cx="82" cy="430" r="3.5" fill="url(#goldMetallic)" />
  <circle cx="430" cy="430" r="3.5" fill="url(#goldMetallic)" />

  <!-- 3. Royal Boutique Crown at Top Center -->
  <g transform="translate(0, 0)" filter="url(#shadowGold)">
    <!-- Crown Arch Base -->
    <path d="M 212 118 Q 256 125 300 118 Q 256 128 212 118 Z" fill="url(#goldMetallic)" />
    <!-- 3 Jewels on band -->
    <circle cx="234" cy="121" r="2.2" fill="#FFFDE8" />
    <circle cx="256" cy="122.5" r="3" fill="#FFFDE8" />
    <circle cx="278" cy="121" r="2.2" fill="#FFFDE8" />
    <!-- Crown 5-Point Peaks -->
    <path d="M 214 118 L 206 95 L 225 106 L 256 78 L 287 106 L 306 95 L 298 118 Z" 
          fill="url(#goldMetallic)" stroke="#8F6B17" stroke-width="0.8" />
    <!-- Peak Pearls / Diamonds -->
    <circle cx="206" cy="94" r="3.2" fill="#FFFBE6" />
    <circle cx="256" cy="76" r="4.5" fill="#FFFBE6" />
    <circle cx="306" cy="94" r="3.2" fill="#FFFBE6" />
    <!-- Center Radiance Star -->
    <polygon points="256,86 258,93 265,95 258,97 256,104 254,97 247,95 254,93" fill="#FFFDE8" />
  </g>

  <!-- 4. Monogram 'KS' - Pure Luxury High-Fashion Monogram -->
  <g filter="url(#shadowGold)" id="monogram">
    <!-- ==================== LETTER K ==================== -->
    <!-- K Vertical Pillar with Classic Didone Serifs -->
    <path d="M 126 168 L 192 168 L 184 182 L 172 182 L 172 342 L 186 342 L 194 356 L 124 356 L 132 342 L 146 342 L 146 182 L 134 182 Z" 
          fill="url(#goldPillar)" />
    <!-- K Pillar Center Lustre Line -->
    <line x1="159" y1="184" x2="159" y2="340" stroke="#FFFDF0" stroke-width="1.8" stroke-opacity="0.75" />

    <!-- K Upper Diagonal Arm (Flaring up-right with graceful serif head) -->
    <path d="M 166 262 L 246 178 L 236 168 L 278 156 L 288 170 L 268 190 L 196 270 Z" 
          fill="url(#goldBevel)" />
    <!-- Upper Arm Bevel Highlight -->
    <line x1="188" y1="264" x2="272" y2="170" stroke="#FFFBE0" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- K Lower Diagonal Leg (Curving gracefully out to bottom right) -->
    <path d="M 188 252 L 224 290 C 246 316, 266 338, 288 344 L 306 344 L 312 358 L 254 358 L 240 344 C 224 330, 208 308, 180 278 Z" 
          fill="url(#goldMetallic)" />

    <!-- ==================== LETTER S (AUTHENTIC LUXURY SERIF S) ==================== -->
    <!-- S Main Body Path with dramatic Didone thick-to-thin contrast -->
    <path d="
      M 378 198
      C 378 178, 362 162, 334 162
      C 292 162, 268 188, 268 214
      C 268 238, 286 252, 320 264
      C 362 278, 396 296, 396 332
      C 396 372, 356 398, 308 398
      C 266 398, 238 376, 234 346
      L 262 342
      C 265 362, 284 376, 310 376
      C 346 376, 368 356, 368 330
      C 368 308, 350 292, 314 280
      C 272 266, 240 246, 240 212
      C 240 174, 278 142, 334 142
      C 382 142, 404 172, 404 198
      Z
    " fill="url(#goldMetallic)" />

    <!-- S Top Terminal Teardrop Accent -->
    <circle cx="390" cy="198" r="9" fill="url(#goldBevel)" />
    <circle cx="390" cy="198" r="4.5" fill="#FFFDE8" />

    <!-- S Bottom Terminal Teardrop Accent -->
    <circle cx="248" cy="344" r="9" fill="url(#goldBevel)" />
    <circle cx="248" cy="344" r="4.5" fill="#FFFDE8" />

    <!-- S Central Spine Lustre Highlight -->
    <path d="M 334 146 C 374 146, 396 172, 396 196 M 316 276 C 354 290, 370 306, 370 328" 
          fill="none" stroke="#FFFDF0" stroke-width="2" stroke-opacity="0.8" />
  </g>

  <!-- 5. Luxury Underline Ribbon / Pedestal Flourish -->
  <g transform="translate(0, 16)" filter="url(#shadowGold)">
    <!-- Center Faceted Jewel -->
    <polygon points="256,410 266,420 256,430 246,420" fill="url(#goldBevel)" />
    <circle cx="256" cy="420" r="2.5" fill="#FFFDE8" />

    <!-- Left Wing Flourish -->
    <path d="M 238 420 Q 190 423 154 412 Q 186 428 234 423 Z" fill="url(#goldMetallic)" />
    <circle cx="150" cy="411" r="3" fill="url(#goldBevel)" />

    <!-- Right Wing Flourish -->
    <path d="M 274 420 Q 322 423 358 412 Q 326 428 278 423 Z" fill="url(#goldMetallic)" />
    <circle cx="362" cy="411" r="3" fill="url(#goldBevel)" />
  </g>

  <!-- 6. Diamond Sparkles -->
  <g transform="translate(382, 150)">
    <polygon points="0,-12 2.5,-3 12,0 2.5,3 0,12 -2.5,3 -12,0 -2.5,-3" fill="#FFFDE8" />
  </g>
</svg>